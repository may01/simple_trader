  - type: profit
    tfs: [15]
    n: 1
    m: 1
    x: 0.3

  - type: profit_strict
    tfs: [15]
    n: 1
    m: 1
    x: 0.3
    l: 15
    y: 0.2

  - type: profit
    tfs: [15]
    n: 2
    m: 1
    x: 0.3

  - type: profit_strict
    tfs: [15]
    n: 2
    m: 1
    x: 0.3
    l: 15
    y: 0.2

  - type: profit

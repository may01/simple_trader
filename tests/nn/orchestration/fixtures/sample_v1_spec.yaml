# Representative Tier-0b v1 spec: recurrent-temporal archetype (conv1d -> lstm -> dense).
# Feature names are real indicators_config.yaml fields; target is a direction kind.
# Locked starting values: recurrent (lstm) => batch_size 64, epochs 50, patience 8.
name: recurrent_temporal_v1
timeframes:
  - 15
  - 60
indicators:
  - logret
  - rsi_14
  - macd_12_26_9_slope
layers:
  - kind: conv1d
    units: 32
    params:
      kernel_size: 3
  - kind: lstm
    units: 64
    params:
      num_layers: 1
  - kind: dense
    units: 32
    params: {}
targets:
  - name: dir_60
    kind: direction
    horizons:
      - 1
    label_tf: 60
batch_size: 64
epochs: 50
early_stopping_patience: 8
learning_rate: 0.001
dropout: 0.2
seed: 42
device: cpu

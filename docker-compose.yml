services:
  graber:
    image: simple_trader
    build: .
    command: python3 grabers/grab_binance.py
    env_file: ${TRAIN_ENV:-configs/train_dataset.env}
    volumes:
      - .:/code
      - simple_trader_vol:/trader_data
      - simple_trader_vol_long:/trader_data_long
    environment:
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}

  ohlc_gen:
    image: simple_trader
    build: .
    command: python3 trainer.py generate_full_ohlc
    env_file: ${TRAIN_ENV:-configs/train_dataset.env}
    volumes:
      - .:/code
      - simple_trader_vol:/trader_data
      - simple_trader_vol_long:/trader_data_long

  simulate:
    image: simple_trader
    build: .
    command: python3 trainer.py simulate
    env_file: ${TRAIN_ENV:-configs/train_dataset.env}
    volumes:
      - .:/code
      - simple_trader_vol:/trader_data
      - simple_trader_vol_long:/trader_data_long

  nn-train:
    build:
      context: .
      dockerfile: docker/Dockerfile.nn-train
    command: python3 trainer.py nn_train
    env_file: ${NN_TRAIN_ENV:-configs/nn_train_dataset.env}
    volumes:
      - .:/code
      # RW: training writes its progress file (shared/training_state.pkl) under
      # /trader_data and never mutates df_with_indicators.pkl. Weights go to _long.
      # See DECISIONS-LOG D8.
      - simple_trader_vol:/trader_data
      - simple_trader_vol_long:/trader_data_long
    environment:
      NN_DEVICE: ${NN_DEVICE:-auto}
      NN_DATA_ROOT: ${NN_DATA_ROOT:-/trader_data}
      NN_ARTEFACT_ROOT: ${NN_ARTEFACT_ROOT:-/trader_data_long}
      NUM_WORKERS: ${NUM_WORKERS:-4}
    # GPU is OPT-IN (CPU by default so the service starts on a host with no GPU/driver).
    # On a GPU host: `docker compose -f docker-compose.yml -f docker-compose.gpu.yml run nn-train`.
    # A hard `deploy.resources.reservations.devices` here would fail the nvidia prestart
    # hook on a driverless host. See DECISIONS-LOG D10.

  simulate-nn:
    build:
      context: .
      dockerfile: docker/Dockerfile.nn-train
    command: python3 trainer.py infer_nn
    env_file: ${NN_TRAIN_ENV:-configs/nn_train_dataset.env}
    volumes:
      - .:/code
      # infer writes the additive df_with_nn.pkl beside df_with_indicators.pkl
      # (never mutates df_with_indicators.pkl), so the data volume is RW here.
      # Training (nn-train) keeps /trader_data RO. See DECISIONS-LOG D8.
      - simple_trader_vol:/trader_data
      - simple_trader_vol_long:/trader_data_long
    environment:
      NN_DEVICE: ${NN_DEVICE:-auto}
      NN_DATA_ROOT: ${NN_DATA_ROOT:-/trader_data}
      NN_ARTEFACT_ROOT: ${NN_ARTEFACT_ROOT:-/trader_data_long}
      NUM_WORKERS: ${NUM_WORKERS:-4}
      NN_INFER_DATASET: ${NN_INFER_DATASET:-}
      NN_INFER_CHECKPOINT: ${NN_INFER_CHECKPOINT:-best}
    # GPU opt-in via docker-compose.gpu.yml (see nn-train note + DECISIONS-LOG D10).

  live:
    image: simple_trader
    build: .
    command: python3 trader.py
    env_file: ${LIVE_ENV:-configs/live.env}
    ports:
      - "8050:8050"
    volumes:
      - .:/code
      - simple_trader_vol:/trader_data
      - simple_trader_vol_long:/trader_data_long
    environment:
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}

  view-sim:
    image: simple_trader
    build: .
    command: python3 view_online_point.py none
    env_file: ${LIVE_ENV:-configs/live.env}
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - .:/code
      - simple_trader_vol:/trader_data
      - simple_trader_vol_long:/trader_data_long
    environment:
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}

  view-full:
    image: simple_trader
    build: .
    command: python3 view_full.py none
    env_file: ${LONG_ENV:-configs/long_dataset.env}
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - .:/code
      - simple_trader_vol_long:/trader_data_long

  view-live:
    image: simple_trader
    build: .
    command: python3 view_onlineB.py none
    env_file: ${LIVE_ENV:-configs/live.env}
    ports:
      - "8070:8070"
    volumes:
      - .:/code
      - simple_trader_vol:/trader_data
    environment:
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}

volumes:
  simple_trader_vol:
    external: true
  simple_trader_vol_long:
    external: true
